services:
  - type: web
    name: self-healing-soc
    runtime: python
    plan: free
    buildCommand: ./render_build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: ""
      - key: JWT_SECRET
        generateValue: true
