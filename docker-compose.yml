services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc_password
      POSTGRES_DB: soc
    volumes:
      - soc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://soc:soc_password@db:5432/soc
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  soc_pgdata:
